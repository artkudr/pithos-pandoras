[package]
name = "pithos-pandoras"
version = "1.0.0"
edition = "2021"
publish = false
description = "Локальный сервис задач PithosPandoras"
default-run = "pithos-pandoras"

# Зависимости из архитектуры. Версии зафиксированы в Cargo.lock.
[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
mime_guess = "2.0.5"
open = "5.4.5"
pulldown-cmark = "0.13.6"
rmcp = { version = "3.9.0", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-embed = "8.14.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.26.1", default-features = false }
uuid = { version = "1.29.2", features = ["v7", "serde"] }
winit = { version = "0.30", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dev-dependencies]
tempfile = "3.27.0"
