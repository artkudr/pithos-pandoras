<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PithosPandoras{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="icon-cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  </svg>
  <header class="top">
    <div class="brand-block">
      <a class="brand" href="/projects" title="Проекты" aria-label="Проекты" {% if current == "projects" %}aria-current="page"{% endif %}>
        <img class="brand-mark" src="/static/icon.svg" alt="" width="24" height="24">
      </a>
      {% if !project_path.is_empty() %}
        <a class="project" href="/p/{{ project_path }}/settings" title="Настройки проекта" {% if current == "settings" %}aria-current="page"{% endif %}>{{ project }}<span class="sr-only"> — настройки проекта</span></a>
      {% endif %}
    </div>
    <nav class="nav" aria-label="Разделы">
      {% if !project_path.is_empty() %}
        <a href="/p/{{ project_path }}" {% if current == "board" %}aria-current="page"{% endif %}>Доска</a>
        <a href="/p/{{ project_path }}/search" {% if current == "search" %}aria-current="page"{% endif %}>Поиск</a>
        <a href="/p/{{ project_path }}/stats" {% if current == "stats" %}aria-current="page"{% endif %}>Статистика</a>
      {% else %}
        <a href="/projects" {% if current == "projects" %}aria-current="page"{% endif %}>Проекты</a>
      {% endif %}
    </nav>
    <div class="top-end">
      <span class="icon-static" aria-hidden="true">
        <svg class="icon"><use href="#icon-gear"></use></svg>
      </span>
    </div>
  </header>
  <main class="page">
    <p class="live-notice" id="live-notice" role="status" hidden>
      На странице есть изменения.
      <button type="button" class="live-reload" id="live-reload">Обновить</button>
    </p>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/ui.js" defer></script>
  <script src="/static/live.js" defer></script>
</body>
</html>
