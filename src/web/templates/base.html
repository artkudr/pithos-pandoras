<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PithosPandoras{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">PithosPandoras</a>
    <span class="workspace"><span class="dot dot-current" aria-hidden="true"></span>{{ workspace }}</span>
    <nav class="nav">
      <a href="/" {% if current == "board" %}aria-current="page"{% endif %}>Доска</a>
      <a href="/search" {% if current == "search" %}aria-current="page"{% endif %}>Поиск</a>
      <a href="/stats" {% if current == "stats" %}aria-current="page"{% endif %}>Статистика</a>
      <a href="/workspaces" {% if current == "workspaces" %}aria-current="page"{% endif %}>Проекты</a>
      <a href="/settings" {% if current == "settings" %}aria-current="page"{% endif %}>Настройки</a>
    </nav>
  </header>
  <main class="page">
    <p class="live-notice" id="live-notice" role="status" hidden>
      На странице есть изменения.
      <button type="button" class="live-reload" id="live-reload">Обновить</button>
    </p>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/live.js" defer></script>
</body>
</html>
