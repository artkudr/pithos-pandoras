<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PithosPandoras{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">PithosPandoras</a>
    <span class="workspace">{{ workspace }}</span>
    <nav class="nav">
      <a href="/">Доска</a>
      <a href="/search">Поиск</a>
      <a href="/stats">Статистика</a>
      <a href="/workspaces">Пространства</a>
      <a href="/settings">Настройки</a>
    </nav>
  </header>
  <main class="page">
    <p class="live-notice" id="live-notice" role="status" hidden>
      На странице есть изменения.
      <button type="button" class="live-reload" id="live-reload">Обновить</button>
    </p>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/live.js" defer></script>
</body>
</html>
